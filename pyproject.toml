[project]
name = "ins-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.38.0",
    "jellyfish>=1.2.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "playwright>=1.62.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=9.1.1",
    "ruff>=0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP047"]

[tool.mypy]
python_version = "3.12"
packages = ["ins_agent"]
mypy_path = "src"
ignore_missing_imports = true
