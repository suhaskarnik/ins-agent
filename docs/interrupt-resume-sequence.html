<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interrupt / approve / resume · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Human-in-the-loop interrupt, durable resume</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="interrupt-resume-title interrupt-resume-desc">
      <title id="interrupt-resume-title">Agent interrupt, durable checkpoint, and resume</title>
      <desc id="interrupt-resume-desc">Sequence diagram showing an agent process interrupting itself, persisting its state to Postgres, terminating, a human approving the checkpoint while the process is down, and a new process instance loading that state back from Postgres to resume execution.</desc>

      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- =================================================================
           LIFELINES — Agent lifeline breaks across the termination/restart
           notes; Postgres and Human run continuously (they never go down).
           Lifeline x-coords: Agent 160, Postgres 500, Human 840
           ================================================================= -->
      <line x1="160" y1="128" x2="160" y2="296" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="160" y1="448" x2="160" y2="616" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="128" x2="500" y2="616" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="128" x2="840" y2="616" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           ACTIVATION BARS — Postgres, one per request/response pair.
           ================================================================= -->
      <rect x="496" y="224" width="8" height="40" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="496" y="352" width="8" height="40" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="496" y="488" width="8" height="40" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>

      <!-- =================================================================
           MESSAGES — time flows top → down.
           ================================================================= -->

      <!-- M1: Agent self-message — interrupt() -->
      <path d="M 168 176 L 204 176 L 204 208 L 168 208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M2: Agent -> Postgres — write checkpoint -->
      <line x1="160" y1="224" x2="496" y2="224" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M3: Postgres -> Agent — persisted -->
      <line x1="496" y1="264" x2="160" y2="264" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M4: Human -> Postgres — approve -->
      <line x1="840" y1="352" x2="504" y2="352" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M5: Postgres -> Human — approved -->
      <line x1="504" y1="392" x2="840" y2="392" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M6: Agent (new instance) -> Postgres — read checkpoint -->
      <line x1="160" y1="488" x2="496" y2="488" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M7: Postgres -> Agent — state loaded -->
      <line x1="496" y1="528" x2="160" y2="528" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M8: Agent self-message — resume execution (headline / coral) -->
      <path d="M 168 568 L 204 568 L 204 600 L 168 600" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- =================================================================
           LIFECYCLE NOTES — process termination and restart, anchored on
           the Agent lifeline. Dashed box, no message implied.
           ================================================================= -->
      <rect x="52" y="296" width="216" height="24" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="160" y="312" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PROCESS TERMINATES</text>

      <rect x="52" y="424" width="216" height="24" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="160" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PROCESS RESTARTS</text>

      <!-- =================================================================
           MESSAGE LABELS — opaque paper masks, 6-10px clear of the stroke.
           ================================================================= -->
      <rect x="176" y="164" width="88" height="12" rx="2" fill="#2d3142"/>
      <text x="220" y="174" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INTERRUPT()</text>

      <rect x="278" y="204" width="100" height="12" rx="2" fill="#2d3142"/>
      <text x="328" y="214" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE STATE</text>

      <rect x="278" y="244" width="100" height="12" rx="2" fill="#2d3142"/>
      <text x="328" y="254" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSISTED OK</text>

      <rect x="622" y="332" width="96" height="12" rx="2" fill="#2d3142"/>
      <text x="670" y="342" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

      <rect x="622" y="372" width="96" height="12" rx="2" fill="#2d3142"/>
      <text x="670" y="382" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVED</text>

      <rect x="278" y="468" width="100" height="12" rx="2" fill="#2d3142"/>
      <text x="328" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ STATE</text>

      <rect x="278" y="508" width="100" height="12" rx="2" fill="#2d3142"/>
      <text x="328" y="518" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE LOADED</text>

      <rect x="212" y="556" width="92" height="12" rx="2" fill="#2d3142"/>
      <text x="258" y="566" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESUME EXEC</text>

      <!-- =================================================================
           ACTOR BOXES — drawn after arrows/labels/notes.
           ================================================================= -->

      <!-- Agent Process (focal / coral) -->
      <rect x="80" y="72" width="160" height="56" rx="6" fill="#2d3142"/>
      <rect x="80" y="72" width="160" height="56" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <rect x="88" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="108" y="89" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="160" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent Process</text>
      <text x="160" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LangGraph node</text>

      <!-- Postgres (store / muted) -->
      <rect x="428" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
      <rect x="428" y="72" width="144" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="436" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"/>
      <text x="448" y="89" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="500" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
      <text x="500" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Checkpoint store</text>

      <!-- Human (external / soft) -->
      <rect x="768" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
      <rect x="768" y="72" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
      <rect x="776" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(142,152,172,0.40)" stroke-width="0.8"/>
      <text x="790" y="89" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="840" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human</text>
      <text x="840" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Approver</text>

      <!-- =================================================================
           LEGEND — horizontal strip at the bottom.
           ================================================================= -->
      <line x1="52" y1="640" x2="948" y2="640" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="52" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="52" y="672" width="14" height="10" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="72" y="680" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

      <rect x="184" y="668" width="4" height="18" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="196" y="680" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

      <line x1="304" y1="678" x2="332" y2="678" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="340" y="680" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Call / return</text>

      <rect x="456" y="668" width="72" height="20" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="536" y="680" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Lifecycle note</text>

      <line x1="672" y1="678" x2="700" y2="678" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="708" y="680" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

    </svg>
  </div>
</body>
</html>
